<title>Texas RIS Price Zones</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#fff}
#app{height:100vh;display:flex;flex-direction:column}
#controls{padding:8px 10px 7px;background:#fff;border-bottom:1px solid #ddd;box-shadow:0 1px 4px rgba(0,0,0,.08);z-index:10}
#title{font-size:17px;font-weight:700;text-align:center;margin-bottom:7px}
.controls-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:7px;max-width:1000px;margin:auto}
select,button{height:40px;border:1px solid #bbb;border-radius:8px;background:#fff;font-size:14px}
select{min-width:0;padding:0 8px}
button{padding:0 12px;font-weight:600}
#hint{font-size:11px;color:#666;text-align:center;margin-top:5px;line-height:1.25}
#map{flex:1;min-height:0}
#map .plotly-graph-div{width:100%!important;height:100%!important}
@media(max-width:560px){
  #title{font-size:16px;margin-bottom:6px}
  .controls-grid{grid-template-columns:1fr 1fr;gap:6px}
  #distSelect{grid-column:1 / span 2} #resetBtn{grid-column:1 / span 2;height:34px}
  select{height:38px;font-size:13px}
  #controls{padding:7px 8px 6px}
}

.hover-row{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px}
.hover-label{font-size:12px;color:#555;font-weight:600}
.hover-mode{height:32px;padding:0 12px;border:1px solid #aaa;border-radius:16px;background:#fff;font-size:12px;font-weight:600}
.hover-mode.active{background:#222;color:#fff;border-color:#222}
@media(max-width:560px){
  .hover-row{margin-top:5px}
  .hover-mode{height:30px;font-size:11px;padding:0 10px}
}

</style>

  }
  if(!points.length) return;
  const lats=points.map(p=>p.lat), lons=points.map(p=>p.lon);
  const b={minLat:Math.min(...lats),maxLat:Math.max(...lats),minLon:Math.min(...lons),maxLon:Math.max(...lons)};
  fitBounds(b,.18);
}

function fitBounds(b,p=.12){
  const g=gd(); if(!g)return;
  const latSpan=Math.max(.8,b.maxLat-b.minLat);
  const lonSpan=Math.max(.9,b.maxLon-b.minLon);
  Plotly.relayout(g,{
    'geo.lataxis.range':[b.minLat-latSpan*p,b.maxLat+latSpan*p],
    'geo.lonaxis.range':[b.minLon-lonSpan*p,b.maxLon+lonSpan*p],
    'geo.center.lat':(b.minLat+b.maxLat)/2,
    'geo.center.lon':(b.minLon+b.maxLon)/2
  });
}

function updateZoneTrace(zone, rows){
  const g=gd(); if(!g)return;
  Plotly.restyle(g,{
    lon:[rows.map(r=>r.lon)],
    lat:[rows.map(r=>r.lat)],
    text:[rows.map(r=>`<b>RIS Price Zone:</b><br>${r.zone}<br><br><b>Distributor${r.distributors.length>1?'s':''}:</b><br>${r.distributors.join('<br>')}`)],
    visible: rows.length>0
  },[zoneTraceIndex[zone]]);
}

function resetAllTraceData(){
  zones.forEach(z=>updateZoneTrace(z, stores.filter(r=>r.zone===z)));
}

function highlightCity(city){
  const g=gd(); if(!g)return;
  if(!city){Plotly.restyle(g,{visible:false},[selectedCityTraceIndex]);return;}
  const p=cityLookup[city];
  Plotly.restyle(g,{lon:[[p.lon]],lat:[[p.lat]],text:[[city]],visible:true},[selectedCityTraceIndex]);
}

function applyFilters(){
  const city=document.getElementById('citySelect').value;
  const zone=document.getElementById('zoneSelect').value;
  const distributor=document.getElementById('distSelect').value;

  let filtered=stores.slice();

  if(city){
    const c=cityLookup[city];
    filtered=filtered.filter(r=>haversine(c.lat,c.lon,r.lat,r.lon)<=CITY_RADIUS_MILES);
  }
  if(zone){
    filtered=filtered.filter(r=>r.zone===zone);
  }
  updateDistributorOpacity(distributor);

  zones.forEach(z=>updateZoneTrace(z, filtered.filter(r=>r.zone===z)));
  highlightCity(city);

  if(city){
    fitPoints(filtered, cityLookup[city]);
  } else if(zone){
    fitPoints(filtered);
  } else {
    fitBounds(texasBounds,.03);
  }

  const hint=document.getElementById('hint');
  if(city && zone) hint.textContent=`${city}: showing ${filtered.length} mapped store location(s) within 50 miles in ${zone}.`;
  else if(city) hint.textContent=`${city}: showing ${filtered.length} mapped store location(s) within 50 miles across all nearby price zones.`;
  else if(zone) hint.textContent=`Showing ${filtered.length} mapped store location(s) in ${zone}.`;
  else hint.textContent='Pick a city, distributor, and/or RIS price zone. County colors show distributor territories; split counties show multiple distributors.';
}

document.getElementById('citySelect').addEventListener('change',applyFilters);
document.getElementById('zoneSelect').addEventListener('change',applyFilters);
document.getElementById('distSelect').addEventListener('change',applyFilters);
document.getElementById('resetBtn').addEventListener('click',()=>{
  document.getElementById('citySelect').value='';
  document.getElementById('zoneSelect').value='';
  document.getElementById('distSelect').value='';
  resetAllTraceData();
  highlightCity('');
  fitBounds(texasBounds,.03);
  document.getElementById('hint').textContent='Pick a city, distributor, and/or RIS price zone. County colors show distributor territories; split counties show multiple distributors.';
});


// Texas county distributor territories.
// County GeoJSON loads in the browser. Multi-distributor counties are split into
// equal vertical slices clipped to the real county polygon using Turf.js.
let distributorTraceIndexes = {};
let countyLineTraceIndex = null;
let countyHoverTraceIndex = null;
let currentHoverMode = 'store';

function polygonToLonLat(geom){
  const lon=[],lat=[];
  const polys=geom.type==='Polygon' ? [geom.coordinates] : geom.coordinates;
  for(const poly of polys){
    for(const ring of poly){
      for(const pt of ring){ lon.push(pt[0]); lat.push(pt[1]); }
      lon.push(null); lat.push(null);
    }
  }
  return {lon,lat};
}

function updateDistributorOpacity(selected){
  const g=gd(); if(!g)return;
  for(const [name,idx] of Object.entries(distributorTraceIndexes)){
    Plotly.restyle(g, {'fillcolor': distributorColors[name],
                       'opacity': (!selected || name===selected) ? 0.30 : 0.055}, [idx]);
  }
}

async function addTexasDistributorCounties(){
  const g=gd(); if(!g)return;
  try{
    const response=await fetch('https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json');
    const geo=await response.json();

    const byDistributor={};
    for(const d of distributors) byDistributor[d]={lon:[],lat:[],hover:[]};
    const lineLon=[],lineLat=[];

    for(const f of geo.features){
      const fips=String(f.id);
      if(!fips.startsWith('48')) continue;

      // Always draw real county outlines.
      const outline=polygonToLonLat(f.geometry);
      lineLon.push(...outline.lon); lineLat.push(...outline.lat);

      const assigned=countyDistributors[fips] || [];
      if(!assigned.length) continue;

      const feature={type:'Feature',properties:f.properties||{},geometry:f.geometry};
      const bb=turf.bbox(feature);
      const width=(bb[2]-bb[0])/assigned.length;

      assigned.forEach((dist,i)=>{
        let piece=feature;
        if(assigned.length>1){
          const clip=[bb[0]+width*i, bb[1], (i===assigned.length-1?bb[2]:bb[0]+width*(i+1)), bb[3]];
          try{ piece=turf.bboxClip(feature,clip); }catch(e){ piece=feature; }
        }
        if(!piece || !piece.geometry) return;
        const a=polygonToLonLat(piece.geometry);
        byDistributor[dist].lon.push(...a.lon);
        byDistributor[dist].lat.push(...a.lat);
      });
    }

    // Territory fills first.
    for(const dist of distributors){
      const a=byDistributor[dist];
      if(!a.lon.length) continue;
      const idx=g.data.length;
      distributorTraceIndexes[dist]=idx;
      await Plotly.addTraces(g,{
        type:'scattergeo', mode:'lines',
        lon:a.lon, lat:a.lat,
        line:{width:0},
        fill:'toself',
        fillcolor:distributorColors[dist],
        opacity:0.30,
        hoverinfo:'skip',
        showlegend:false,
        name:dist
      });
    }

    // Invisible county hover layer: hover anywhere over a county to see
    // county name and all assigned distributors, including multi-distributor counties.
    const hoverFeatures=[];
    const hoverLocations=[];
    const hoverText=[];
    for(const f of geo.features){
      const fips=String(f.id);
      if(!fips.startsWith('48')) continue;
      const assigned=countyDistributors[fips] || [];
      const countyName=(f.properties && (f.properties.NAME || f.properties.name)) || ('County ' + fips);
      hoverFeatures.push(f);
      hoverLocations.push(fips);
      hoverText.push(
        '<b>' + countyName + ' County</b><br>' +
        (assigned.length
          ? '<b>Distributor' + (assigned.length>1?'s':'') + ':</b><br>' + assigned.join('<br>')
          : '<b>Distributor:</b> Not assigned')
      );
    }

    countyHoverTraceIndex=g.data.length;
    await Plotly.addTraces(g,{
      type:'choropleth',
      geojson:{type:'FeatureCollection',features:hoverFeatures},
      locations:hoverLocations,
      z:hoverLocations.map(()=>1),
      text:hoverText,
      hovertemplate:'%{text}<extra></extra>',
      colorscale:[[0,'rgba(255,255,255,0.001)'],[1,'rgba(255,255,255,0.001)']],
      showscale:false,
      marker:{line:{width:0}},
      showlegend:false,
      visible:false,
      name:'County distributor hover'
    });

    // County outlines on top.
    countyLineTraceIndex=g.data.length;
    await Plotly.addTraces(g,{
      type:'scattergeo',mode:'lines',
      lon:lineLon,lat:lineLat,
      line:{color:'rgba(75,75,75,.72)',width:.75},
      hoverinfo:'skip',showlegend:false,name:'Texas county lines'
    });

    // Move store and label traces back above territory fills.
    // Plotly draws later traces on top; redraw current data ordering visually by
    // keeping territory opacity light enough for dots/labels to remain clear.
    updateDistributorOpacity(document.getElementById('distSelect').value);
  }catch(e){
    console.warn('Distributor county layer could not load',e);
  }
}


function setHoverMode(mode){
  currentHoverMode=mode;
  const g=gd();
  const storeBtn=document.getElementById('storeHoverBtn');
  const distBtn=document.getElementById('distHoverBtn');

  storeBtn.classList.toggle('active', mode==='store');
  distBtn.classList.toggle('active', mode==='distributor');

  if(g && countyHoverTraceIndex!==null){
    Plotly.restyle(g,{visible: mode==='distributor'},[countyHoverTraceIndex]);
  }

  // In distributor mode, county hover is the focus.
  // In store mode, the transparent county overlay is hidden so store marker hover/tap works normally.
  const hint=document.getElementById('hint');
  if(mode==='distributor'){
    hint.textContent='Distributor hover is ON. Hover/tap a county to see its assigned distributor(s).';
  } else {
    hint.textContent='Store hover is ON. Hover/tap a store marker to see its RIS Price Zone and mapped distributor.';
  }
}

document.getElementById('storeHoverBtn').addEventListener('click',()=>setHoverMode('store'));
document.getElementById('distHoverBtn').addEventListener('click',()=>setHoverMode('distributor'));

window.addEventListener('load',()=>setTimeout(async()=>{
  const g=gd();
  if(g){
    Plotly.relayout(g,{width:document.getElementById('map').clientWidth,height:document.getElementById('map').clientHeight});
    fitBounds(texasBounds,.03);
    applyFilters();
    await addTexasDistributorCounties();
    setHoverMode('store');
  }
},180));

window.addEventListener('resize',()=>{
  clearTimeout(window._r);
  window._r=setTimeout(()=>{
    const g=gd();
    if(g)Plotly.relayout(g,{width:document.getElementById('map').clientWidth,height:document.getElementById('map').clientHeight});
  },100);
});
</script>
</body>
